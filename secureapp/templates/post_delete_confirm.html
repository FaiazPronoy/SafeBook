{% extends "base.html" %}
{% block title %}Delete post · SafeBook{% endblock %}
{% block content %}
<div class="auth-one">
  <section class="card auth-card">
    <div class="card-body">
      <h1>Delete this post?</h1>
      {% if body %}<blockquote class="quote">{{ body|truncatewords:40 }}</blockquote>{% endif %}
      <p class="muted small">The post, its comments and every copy of its key go together.
        There is no undo.</p>
      <form method="post">
        {% csrf_token %}
        <div class="actions">
          <button class="btn danger" type="submit">Delete post</button>
          <a class="btn-soft" href="{% url 'post_detail' post.id %}">Keep it</a>
        </div>
      </form>
    </div>
  </section>
</div>
{% endblock %}
