{% extends "base.html" %}
{% block title %}Delete note · SafeBook{% endblock %}
{% block content %}
<div class="auth">
  <div class="card is-broken">
    <div class="card-head"><h2>Delete this note?</h2></div>
    <div class="card-body">
      <p><b>{{ title }}</b></p>
      <p class="muted small">The note and its key both go. There is no undo, and nothing
        is left behind that could be used to get it back.</p>
      <form method="post">
        {% csrf_token %}
        <div class="actions">
          <button class="btn danger" type="submit">Delete permanently</button>
          <a class="btn-ghost" href="{% url 'post_detail' post.id %}">Keep it</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
